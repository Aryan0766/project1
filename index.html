<!DOCTYPE html>
<html lang="en">
  <head>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #f5e6d3;
      }

      canvas {
        display: block;
      }
    </style>
  </head>

  <body>
    <script>
      let spacing = 25;
      let cols;
      let rows;

      let palette = [
        '#d1495b',
        '#edae49',
        '#00798c',
        '#30638e',
        '#003d5b',
        '#7b2cbf'
      ];

      function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();

        cols = ceil(width / spacing) + 10;
        rows = ceil(height / spacing) + 10;
      }

      function draw() {
        // A slightly transparent background creates soft visual trails.
        background(245, 230, 211, 40);

        // Mouse left/right = organized to chaotic
        let chaos = constrain(mouseX / width, 0, 1);

        // Mouse top/bottom = smaller to larger, more spread-out squares
        let bleed = constrain(mouseY / height, 0, 1);

        // Start outside the visible canvas so shifted squares cover every edge.
        let startX = -spacing * 2;
        let startY = -spacing * 2;

        for (let i = 0; i < cols; i++) {
          for (let j = 0; j < rows; j++) {
            // Fixed seed makes each grid position have its own stable character.
            randomSeed(i * 2000 + j);

            let baseX = startX + i * spacing;
            let baseY = startY + j * spacing;

            // The square moves farther from its grid location as chaos grows.
            let offsetX = random(-spacing * 0.9, spacing * 0.9) * chaos;
            let offsetY = random(-spacing * 0.9, spacing * 0.9) * chaos;

            let x = baseX + offsetX;
            let y = baseY + offsetY;

            // Each square gently pulses at a different rate/phase.
            let pulse = sin(frameCount * 0.03 + i + j) * 10;
             //.03= speed of pulsing // 
            // Moving downward makes the colored square larger.
            let size =
              spacing * (0.10 + bleed * 10) +
              random(-10, 10) * chaos +
              pulse;

            let outerColor = color(random(palette));
            outerColor.setAlpha(map(bleed, 0, 1, 230, 80));

            push();
            translate(x, y);

            // Squares rotate more when the mouse is farther right.
            rotate(random(-PI, PI) * chaos);

            rectMode(CENTER);
            noStroke();

            // Outer dyed square.
            fill(outerColor);
            square(0, 0, size);

            // Inner resist square.
            fill('#f5e6d3');
            let resistSize = size * map(bleed, 0, 1, 0.55, 0.12);
            square(0, 0, resistSize);

            pop();
          }
        }
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);

        cols = ceil(width / spacing) + 4;
        rows = ceil(height / spacing) + 4;
      }
    </script>
  </body>
</html>
