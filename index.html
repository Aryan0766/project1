<!DOCTYPE html>
<html lang="en">
  <head>
 
    <title>Casey Reas Inspired Squares</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.3.3/p5.min.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #f5e6d3;
      }

      canvas {
        display: block;
      }
    </style>
  </head>

  <body>
    <script>
      const spacing = 20;
      let squares = [];

      //Color recomendation taken from AI.
      const palette = [
        "#ef476f", // coral pink
        "#e63973", // magenta
        "#9d4edd", // violet
        "#5a189a", // deep purple
        "#ff9f1c", // warm orange
        "#ffd166", // soft golden yellow
        "#2b2d6e" // dark indigo
      ];

      function setup () {
        createCanvas(windowWidth, windowHeight);
        noStroke();
        rectMode(CENTER);

        makeGrid();
      }

      function makeGrid () {
        squares = [];
// RESCOURCES USED: THE CODING TRAIN( YOUTUBE VIDEO)
        for (let x = -spacing; x < width + spacing; x += spacing) {
          for (let y = -spacing; y < height + spacing; y += spacing) {
            squares.push({
              x: x,
              y: y,
              color: random(palette),
              offsetX: random(-spacing, spacing),
              offsetY: random(-spacing, spacing),
              rotation: random(-PI, PI),
              sizeChange: random(-8, 8)
            });
          }
        }
      }
 // RESCOURCES USED: THE CODING TRAIN( YOUTUBE VIDEO)
      function draw () {
        background(255, 242, 230, 20);

        const chaos = constrain(mouseX / width, 0, 1);
        const bleed = constrain(mouseY / height, 0, 1);

        for (const item of squares) {
          const x = item.x + item.offsetX * chaos;
          const y = item.y + item.offsetY * chaos;

          const size =
            spacing * (0.4 + bleed * 4) +
            item.sizeChange * chaos;

          const outerColor = color(item.color);
          outerColor.setAlpha(map(bleed, 0, 1, 230, 80));
          // Save the canvas setting before changing the position and rotation.
          push();
          translate(x, y);
          // Rotate the square around its center.
          rotate(item.rotation * chaos);

          fill(outerColor);
          square(0, 0, size);

          fill("#f5e6d3");
          square(0, 0, size * map(bleed, 0, 1, 0.55, 0.12));
          // Restore the original canvas position and rotation
          pop();
        }
      }

      function windowResized () {
        resizeCanvas(windowWidth, windowHeight);
        makeGrid();
      }
    </script>
  </body>
</html>
